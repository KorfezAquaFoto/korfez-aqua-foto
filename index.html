<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Körfez Aqua - Greenbox Fotoğraf Teslimatı</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0072ff, #00c6ff); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: #333; }
        .card { background: #ffffff; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 100%; max-width: 420px; padding: 25px; text-align: center; }
        .logo { max-width: 180px; height: auto; margin-bottom: 15px; }
        .photo-container { border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin: 15px 0; background: #f8f9fa; min-height: 200px; display: flex; align-items: center; justify-content: center; }
        .photo-container img { width: 100%; height: auto; display: block; border-radius: 12px; }
        .btn-download { display: inline-block; width: 100%; background: #0072ff; color: #fff; font-weight: bold; font-size: 16px; padding: 14px; border-radius: 10px; text-decoration: none; transition: background 0.3s; box-shadow: 0 4px 12px rgba(0,114,255,0.3); margin-top: 10px; }
        .btn-download:active { background: #0056b3; }
        .kvkk-info { font-size: 11px; color: #777; margin-top: 18px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="card">
    <!-- Körfez Aqua Logosu -->
    <img src="logo.png" alt="Körfez Aqua Logo" class="logo" onerror="this.style.display='none'">
    
    <div class="photo-container">
        <img id="userPhoto" src="" alt="Fotoğraf Yükleniyor...">
    </div>

    <a id="downloadBtn" href="#" download class="btn-download">FOTOĞRAFI İNDİR</a>

    <p class="kvkk-info">
        🔒 <b>KVKK ve Gizlilik Bildirimi:</b><br>
        Bu fotoğraf Körfez Aqua ziyaretiniz anında üretilmiştir. Fotoğraflarınız kişisel verilerin korunması kanunu gereği 1 saat sonra sistemden otomatik olarak silinecektir.
    </p>
</div>

<script>
    // URL'den fotoğraf parametresini alma (?f=foto_123.jpg)
    const urlParams = new URLSearchParams(window.location.search);
    const photoName = urlParams.get('f');

    if (photoName) {
        const photoUrl = 'https://raw.githubusercontent.com/KorfezAquaFoto/korfez-aqua-foto/main/' + photoName;
        document.getElementById('userPhoto').src = photoUrl;
        document.getElementById('downloadBtn').href = photoUrl;
        document.getElementById('downloadBtn').target = "_blank";
    } else {
        document.querySelector('.card').innerHTML = '<h3>Fotoğraf bulunamadı veya süresi doldu.</h3>';
    }
</script>

</body>
</html>
